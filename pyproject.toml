[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daphniascope"
version = "0.1.0"
description = "Automated body-length measurement for Daphnia magna in multi-well plates"
readme = "README.md"
requires-python = ">=3.13"
# Dependencies are managed with conda — see environment.yml. This list is kept
# empty on purpose: it exists so packaging/tooling has a place to grow.
dependencies = []

[tool.setuptools.packages.find]
include = ["daphnia*"]
